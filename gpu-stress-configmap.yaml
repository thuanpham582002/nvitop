apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-stress-scripts
  namespace: gpu-operator
  labels:
    app: nvidia-nvitop-exporter
    app.kubernetes.io/managed-by: gpu-operator
data:
  gpu_random_stress.py: |
    #!/opt/nvitop-env/python/bin/python3

    import torch
    import threading
    import time
    import random
    import signal
    import sys
    import os
    from datetime import datetime

    # ============================
    # Configuration
    TARGET_UTILIZATION = 30    # Target GPU utilization (%)
    TARGET_MEMORY = 50         # Target GPU memory utilization (%)
    MIN_MAT_SIZE = 800         # Minimum matrix size
    MAX_MAT_SIZE = 2000        # Maximum matrix size
    MIN_CHAIN = 3              # Minimum chain operations
    MAX_CHAIN = 8              # Maximum chain operations
    MIN_SLEEP = 0.001          # Minimum sleep between operations
    MAX_SLEEP = 0.05           # Maximum sleep between operations
    MEMORY_CHECK_INTERVAL = 5  # Check memory usage every N seconds
    # ============================

    class GPURandomStress:
        def __init__(self):
            self.running = True
            self.threads = []
            self.memory_tensors = []
            self.device_info = {}

            # Setup signal handlers
            signal.signal(signal.SIGINT, self.signal_handler)
            signal.signal(signal.SIGTERM, self.signal_handler)

            # Initialize device info
            self.init_device_info()

        def signal_handler(self, signum, frame):
            print(f"\n{'='*60}")
            print(f"🛑 Received signal {signum}. Shutting down gracefully...")
            print(f"📊 Final Statistics:")
            self.print_stats()
            self.running = False
            sys.exit(0)

        def init_device_info(self):
            """Initialize GPU device information"""
            if not torch.cuda.is_available():
                print("❌ CUDA not available. Running on CPU only.")
                return

            for i in range(torch.cuda.device_count()):
                device = torch.device(f"cuda:{i}")
                props = torch.cuda.get_device_properties(device)
                total_memory = props.total_memory / (1024**3)  # GB

                self.device_info[i] = {
                    'name': props.name,
                    'total_memory': total_memory,
                    'target_memory': total_memory * (TARGET_MEMORY / 100),
                    'compute_capability': f"{props.major}.{props.minor}",
                    'multiprocessors': props.multi_processor_count
                }

            print(f"🔍 Found {len(self.device_info)} GPU(s):")
            for gpu_id, info in self.device_info.items():
                print(f"   GPU {gpu_id}: {info['name']}")
                print(f"   ├─ Memory: {info['total_memory']:.1f}GB (target: {info['target_memory']:.1f}GB)")
                print(f"   └─ Compute: {info['compute_capability']} ({info['multiprocessors']} SMs)")

        def get_gpu_memory_usage(self, gpu_id):
            """Get current GPU memory usage"""
            try:
                device = torch.device(f"cuda:{gpu_id}")
                memory_allocated = torch.cuda.memory_allocated(device) / (1024**3)
                memory_total = torch.cuda.get_device_properties(device).total_memory / (1024**3)
                memory_percent = (memory_allocated / memory_total) * 100
                return memory_allocated, memory_total, memory_percent
            except:
                return 0, 0, 0

        def adjust_memory_allocation(self, gpu_id):
            """Dynamically adjust memory allocation to reach target"""
            current_allocated, total_memory, current_percent = self.get_gpu_memory_usage(gpu_id)
            target_allocated = total_memory * (TARGET_MEMORY / 100)

            if current_percent < TARGET_MEMORY - 5:  # Need more memory
                needed = target_allocated - current_allocated
                size_gb = min(needed, 2.0)  # Allocate max 2GB at a time
                size_bytes = int(size_gb * 1024**3)

                try:
                    tensor = torch.empty(size_bytes // 4, dtype=torch.float32, device=f"cuda:{gpu_id}")
                    self.memory_tensors.append((gpu_id, tensor))
                    print(f"[GPU {gpu_id}] 💾 +{size_gb:.1f}GB (Current: {current_percent:.1f}% → Target: {TARGET_MEMORY}%)")

                except RuntimeError as e:
                    print(f"[GPU {gpu_id}] ❌ Failed to allocate {size_gb:.1f}GB: {e}")

            elif current_percent > TARGET_MEMORY + 5:  # Too much memory
                # Remove some tensors
                removed = 0
                for i, (tid, _) in enumerate(self.memory_tensors):
                    if tid == gpu_id and removed < 2:  # Remove max 2 tensors
                        del self.memory_tensors[i]
                        removed += 1
                        break
                if removed > 0:
                    torch.cuda.empty_cache()
                    print(f"[GPU {gpu_id}] 🗑️  Cleaned up memory (Current: {current_percent:.1f}% → Target: {TARGET_MEMORY}%)")

        def random_workload_thread(self, gpu_id, thread_id):
            """Random computational workload thread for a specific GPU"""
            device = torch.device(f"cuda:{gpu_id}")
            print(f"[Thread {thread_id}] 🚀 Starting random workload on {device}")

            iteration = 0
            last_memory_check = time.time()

            while self.running:
                try:
                    # Random matrix size and chain operations
                    mat_size = random.randint(MIN_MAT_SIZE, MAX_MAT_SIZE)
                    chain_ops = random.randint(MIN_CHAIN, MAX_CHAIN)
                    sleep_time = random.uniform(MIN_SLEEP, MAX_SLEEP)

                    # Create random matrices
                    a = torch.randn((mat_size, mat_size), device=device, requires_grad=True)
                    b = torch.randn((mat_size, mat_size), device=device, requires_grad=True)

                    # Perform random computational operations
                    x = a @ b
                    for _ in range(chain_ops):
                        if random.random() < 0.5:
                            x = x @ b
                        else:
                            x = torch.relu(x) @ b

                    # Random backward pass
                    if random.random() < 0.7:  # 70% chance
                        loss = x.sum()
                        loss.backward()

                    # Random element-wise operations
                    if random.random() < 0.3:  # 30% chance
                        x = torch.sin(x) + torch.cos(x)
                        x = torch.softmax(x.flatten()[:1000], dim=0)

                    torch.cuda.synchronize(device)
                    time.sleep(sleep_time)

                    iteration += 1

                    # Memory management check
                    current_time = time.time()
                    if current_time - last_memory_check > MEMORY_CHECK_INTERVAL:
                        self.adjust_memory_allocation(gpu_id)
                        last_memory_check = current_time

                    # Progress reporting
                    if iteration % 50 == 0:
                        current_allocated, total_memory, current_percent = self.get_gpu_memory_usage(gpu_id)
                        print(f"[Thread {thread_id}] GPU {gpu_id}: {iteration} iterations | "
                              f"Matrix: {mat_size}x{mat_size} | Chain: {chain_ops} | "
                              f"Memory: {current_percent:.1f}% ({current_allocated:.1f}GB/{total_memory:.1f}GB)")

                except RuntimeError as e:
                    print(f"[Thread {thread_id}] GPU {gpu_id} error: {e}")
                    time.sleep(1)  # Wait before retrying
                    continue

        def cpu_workload_thread(self, thread_id):
            """CPU fallback workload"""
            print(f"[Thread {thread_id}] 🖥️  Running CPU workload...")

            iteration = 0
            while self.running:
                try:
                    mat_size = random.randint(500, 1000)
                    a = torch.randn((mat_size, mat_size))
                    b = torch.randn((mat_size, mat_size))

                    x = a @ b
                    for _ in range(random.randint(2, 5)):
                        x = x @ b

                    loss = x.sum()
                    loss.backward()

                    time.sleep(random.uniform(0.01, 0.1))
                    iteration += 1

                    if iteration % 20 == 0:
                        print(f"[Thread {thread_id}] CPU: {iteration} iterations | Matrix: {mat_size}x{mat_size}")

                except Exception as e:
                    print(f"[Thread {thread_id}] CPU error: {e}")
                    time.sleep(1)

        def monitor_thread(self):
            """Monitoring thread for overall statistics"""
            print(f"[Monitor] 📊 Starting monitoring...")

            while self.running:
                time.sleep(10)  # Report every 10 seconds

                if not self.running:
                    break

                print(f"\n{'='*60}")
                print(f"📊 {datetime.now().strftime('%H:%M:%S')} - GPU Stress Test Status")
                print(f"{'='*60}")

                if torch.cuda.is_available():
                    for gpu_id in range(torch.cuda.device_count()):
                        current_allocated, total_memory, current_percent = self.get_gpu_memory_usage(gpu_id)
                        info = self.device_info.get(gpu_id, {})

                        print(f"GPU {gpu_id} ({info.get('name', 'Unknown')}):")
                        print(f"  ├─ Memory: {current_percent:.1f}% ({current_allocated:.1f}GB/{total_memory:.1f}GB) [Target: {TARGET_MEMORY}%]")

                        # Memory status indicator
                        if current_percent >= TARGET_MEMORY - 5:
                            memory_status = "✅"
                        elif current_percent >= TARGET_MEMORY - 15:
                            memory_status = "⚠️"
                        else:
                            memory_status = "❌"
                        print(f"  └─ Status: {memory_status}")
                else:
                    print("CPU Mode: No GPU available")

        def print_stats(self):
            """Print final statistics"""
            if torch.cuda.is_available():
                for gpu_id in range(torch.cuda.device_count()):
                    current_allocated, total_memory, current_percent = self.get_gpu_memory_usage(gpu_id)
                    print(f"   GPU {gpu_id}: {current_percent:.1f}% memory usage")

        def run(self):
            """Main execution function"""
            print(f"\n🎯 Random GPU Stress Test Started!")
            print(f"📋 Configuration:")
            print(f"   ├─ Target Memory: {TARGET_MEMORY}%")
            print(f"   ├─ Matrix Size: {MIN_MAT_SIZE}-{MAX_MAT_SIZE}")
            print(f"   ├─ Chain Operations: {MIN_CHAIN}-{MAX_CHAIN}")
            print(f"   └─ Sleep Interval: {MIN_SLEEP}-{MAX_SLEEP}s")
            print(f"{'='*60}")

            # Start monitor thread
            monitor = threading.Thread(target=self.monitor_thread, daemon=True)
            monitor.start()

            if torch.cuda.is_available():
                # Create workload threads for each GPU
                for gpu_id in range(torch.cuda.device_count()):
                    thread = threading.Thread(
                        target=self.random_workload_thread,
                        args=(gpu_id, gpu_id),
                        daemon=True
                    )
                    self.threads.append(thread)
                    thread.start()

                    # Small delay between thread starts
                    time.sleep(0.1)
            else:
                # CPU fallback
                for i in range(2):  # 2 CPU threads
                    thread = threading.Thread(
                        target=self.cpu_workload_thread,
                        args=(i,),
                        daemon=True
                    )
                    self.threads.append(thread)
                    thread.start()

            try:
                # Keep main thread alive
                while self.running:
                    time.sleep(1)
            except KeyboardInterrupt:
                self.signal_handler(signal.SIGINT, None)

    if __name__ == "__main__":
        stress_test = GPURandomStress()
        stress_test.run()